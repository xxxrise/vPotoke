<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Смена 03 — симулятор скорой помощи</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--bg:#05080d;--p1:#0a1018;--p2:#0f1823;--p3:#152130;--ln:#1d2a3a;--tx:#e8eef6;--mu:#7d8fa6;--ecg:#3dff8f;--spo:#36d7ff;--bp:#ff6b78;--rr:#ffd447;--am:#ffad33;--rd:#ff3d51;--gn:#2fe38a;--vi:#b48cff;--bl:#4c8dff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
html,body{touch-action:manipulation}
img,svg,canvas{-webkit-user-drag:none}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;font-size:15px}
body{min-height:100vh;min-height:100dvh;overscroll-behavior:none}
#app{max-width:520px;margin:0 auto;padding:calc(12px + var(--sat)) calc(12px + var(--sar)) calc(28px + var(--sab)) calc(12px + var(--sal))}
html.fs body{background:var(--bg)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.disp{font-family:Unbounded,Manrope,sans-serif}
button{font-family:inherit;color:inherit}
.btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--ln);background:var(--p2);font-weight:700;font-size:15px;text-align:left;cursor:pointer;margin-top:10px;transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn .ic{font-size:22px;width:30px;text-align:center;flex:none}
.btn .bt{flex:1;min-width:0}
.btn small{display:block;font-weight:500;color:var(--mu);font-size:12.5px;margin-top:2px}
.btn.primary{background:linear-gradient(135deg,#ff3d51,#b9182f);border-color:#ff5a6b;color:#fff}
.btn.primary small{color:#ffd9dd}
.btn.green{background:linear-gradient(135deg,#1fbf6c,#0f8a4a);border-color:#38e08a;color:#fff}
.btn.blue{background:linear-gradient(135deg,#2f6bff,#1d47b8);border-color:#5b8cff;color:#fff}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.center{justify-content:center;text-align:center}
.row{display:flex;gap:8px;align-items:center}
.mut{color:var(--mu)}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-top:12px}
.sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:16px 0 8px;font-weight:800}
/* menu */
.logo{padding:18px 4px 6px}
.logo h1{margin:0;font-size:34px;font-weight:900;letter-spacing:-.02em;line-height:1}
.logo h1 b{color:var(--rd)}
.logo p{margin:6px 0 0;color:var(--mu);font-size:13.5px}
.heroecg{height:70px;margin:10px 0 2px;border-radius:12px;background:#03070b;border:1px solid var(--ln);position:relative;overflow:hidden}
.heroecg canvas{width:100%;height:100%;display:block}
.rank{display:flex;gap:12px;align-items:center}
.rank .badge{font-size:30px;width:52px;height:52px;border-radius:14px;background:var(--p3);display:grid;place-items:center;flex:none}
.bar{height:7px;background:var(--p3);border-radius:9px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gn),var(--spo));border-radius:9px}
.foot{font-size:11.5px;color:var(--mu);text-align:center;margin-top:22px;line-height:1.5}
/* topbar */
.top{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px}
#onc{white-space:nowrap}
.top .clk{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:17px}
.pill{padding:4px 9px;border-radius:99px;font-size:11.5px;font-weight:800;background:var(--p3);white-space:nowrap}
.pill.g{background:#0f3a26;color:var(--gn)}.pill.a{background:#3a2a0c;color:var(--am)}.pill.r{background:#3d0e17;color:#ff7684}
.pill.blink{animation:blink 1s infinite}
.ib{border:1px solid var(--ln);background:var(--p2);border-radius:10px;padding:6px 10px;font-size:14px;cursor:pointer}
.sp{flex:1}
@keyframes blink{50%{opacity:.35}}
/* dispatch */
.callc{position:relative;background:var(--p1);border:1px solid var(--ln);border-radius:16px;padding:14px 14px 14px 18px;margin-top:10px;overflow:hidden;cursor:pointer}
.callc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.callc .pr{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--c)}
.callc .why{font-weight:700;margin:6px 0 4px;line-height:1.35}
.callc .ad{font-size:12.5px;color:var(--mu)}
.radio{font-size:12.5px;color:#a9bbd0;background:#0b1520;border:1px dashed #23364b;border-radius:12px;padding:10px 12px;margin-top:10px;line-height:1.45}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat3>div{background:var(--p1);border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:center}
.stat3 b{display:block;font-family:'JetBrains Mono',monospace;font-size:18px}
.stat3 span{font-size:11px;color:var(--mu)}
/* travel */
.travel{height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.road{width:100%;height:120px;position:relative;overflow:hidden;border-radius:16px;background:#0b1118;margin:20px 0}
.road:after{content:"";position:absolute;left:-50%;right:-50%;top:58%;height:4px;background:repeating-linear-gradient(90deg,#3a4656 0 40px,transparent 40px 80px);animation:road .5s linear infinite}
@keyframes road{to{transform:translateX(-80px)}}
.amb{position:absolute;left:50%;top:22%;font-size:56px;transform:translateX(-50%) scaleX(-1);animation:bump .25s infinite alternate}
@keyframes bump{to{margin-top:-3px}}
.lights{position:absolute;inset:0;animation:lights .5s infinite;opacity:.25}
@keyframes lights{0%,49%{background:radial-gradient(circle at 40% 30%,#ff2a3d,transparent 45%)}50%,100%{background:radial-gradient(circle at 60% 30%,#2a6bff,transparent 45%)}}
/* call screen */
.mon{background:#02050a;border:1px solid #16212e;border-radius:16px;padding:8px;position:relative}
.ecgw{height:92px;position:relative;border-radius:10px;overflow:hidden;background:#000 linear-gradient(#0a1a12 1px,transparent 1px) 0 0/100% 23px}
.ecgw canvas{width:100%;height:100%;display:block}
.ecgw .ld{position:absolute;left:8px;top:5px;font:700 10px 'JetBrains Mono',monospace;color:#2b8f5a}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;color:#5f7187;font-size:13px;background:#020509}
.cover button{border:1px solid #23415e;background:#0c1b2b;color:#9cc6ff;padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer}
.vg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.tile{background:#060b12;border-radius:10px;padding:6px 8px;border:1px solid #111b27;min-width:0}
.tile .tl{font-size:10px;font-weight:800;color:var(--c);letter-spacing:.04em}
.tile .tv{font-size:20px;font-weight:800;color:var(--c);line-height:1.15;white-space:nowrap}
.tile .tu{font-size:9.5px;color:#56677c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.big .tv{font-size:28px}
.tile.w2{grid-column:span 2}
.tile.alarm{animation:alarm .7s infinite}
@keyframes alarm{50%{background:#3d0a12;border-color:#ff3d51}}
.pt{display:flex;gap:12px;margin-top:10px;align-items:flex-start}
.av{font-size:34px;width:52px;height:52px;border-radius:14px;background:var(--p2);display:grid;place-items:center;flex:none}
.pt b{font-size:15px}
.scene{font-size:13.5px;color:#c4d0de;line-height:1.45;margin-top:3px}
.log{margin-top:10px;font-size:12.5px;line-height:1.5}
.log div{padding:3px 0;border-bottom:1px dashed #152030;color:#a8b8cb}
.log div b{font-family:'JetBrains Mono',monospace;color:#5f7187;font-weight:500;margin-right:6px}
.log .good{color:#7ff0b4}.log .bad{color:#ff8b96}.log .warn{color:#ffcd7a}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
.tabs button{border:1px solid var(--ln);background:var(--p1);border-radius:11px;padding:9px 2px;font-size:12.5px;font-weight:800;cursor:pointer}
.tabs button.on{background:var(--tx);color:#05080d;border-color:var(--tx)}
.act{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--ln);background:var(--p1);border-radius:12px;padding:11px 12px;margin-top:6px;cursor:pointer;font-size:14px;font-weight:600}
.act:active{background:var(--p3)}
.act span{flex:1;min-width:0}
.act span.tg,.act span.cnt{flex:none}
.txq{width:100%;margin-top:8px;padding:11px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--p2);color:var(--tx);font:600 14px Manrope,sans-serif;outline:none}
.txq:focus{border-color:var(--spo)}
.act small{display:block;color:var(--mu);font-weight:500;font-size:12px;margin-top:1px}
.act em{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mu);white-space:nowrap}
.act .tg{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:#1a2a40;color:#8fb6ff}
.act .cnt{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:#0f3a26;color:var(--gn)}
.act.done{opacity:.85}
.res{font-size:13px;line-height:1.45;color:#cfe0f0;background:#0a141e;border-left:3px solid var(--spo);border-radius:0 10px 10px 0;padding:8px 10px;margin:4px 0 2px}
.qa{margin-top:8px}
.qa .q{font-size:13px;color:var(--mu)}
.qa .a{background:var(--p2);border-radius:4px 14px 14px 14px;padding:9px 12px;margin-top:4px;font-size:14px;line-height:1.45}
.who{font-size:12px;color:var(--mu);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ln);background:var(--p1);border-radius:99px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--spo);color:#021018;border-color:var(--spo)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--ln);background:var(--p1);border-radius:12px;padding:10px 12px;margin-top:6px;cursor:pointer;font-size:14px;font-weight:700}
.opt small{display:block;font-weight:500;color:var(--mu);font-size:12px}
.opt.on{border-color:var(--spo);background:#062030}
.busy{position:fixed;inset:0;background:rgba(2,5,9,.55);display:none;align-items:flex-end;justify-content:center;z-index:50;padding-bottom:30vh}
.busy.on{display:flex}
.busy div{background:var(--p2);border:1px solid var(--ln);padding:14px 18px;border-radius:14px;font-weight:700;min-width:240px;text-align:center}
.busy i{display:block;height:4px;background:var(--spo);border-radius:4px;margin-top:10px;animation:prog .45s linear forwards;transform-origin:left}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* modal */
.modal{position:fixed;inset:0;background:rgba(1,3,6,.8);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--p1);border:1px solid var(--ln);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:calc(100vh - var(--sat) - 10px);max-height:calc(var(--vh,100dvh) - var(--sat) - 10px);overflow:auto;overscroll-behavior:contain;padding:16px calc(14px + var(--sar)) calc(18px + var(--sab)) calc(14px + var(--sal))}
.sheet h3{margin:0 0 6px;font-family:Unbounded,sans-serif;font-size:17px}
.paper{width:100%;display:block;border-radius:8px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%);background:#1b2a3c;border:1px solid #2c4058;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:99;max-width:90vw;text-align:center;animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
/* cpr */
.cprh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cprh .al{color:var(--rd);font-weight:900;font-size:11px;letter-spacing:.02em;animation:blink .8s infinite;white-space:nowrap}
.cprh .pill{font-size:10.5px;padding:3px 7px}
#cprT{white-space:nowrap;font-size:13px}
.callc .mono{white-space:nowrap}
.cpr .ecgw{height:130px}
.cstat{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cstat span{background:var(--p2);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:700}
.rate{text-align:center;margin-top:10px}
.rate .rv{font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:800;line-height:1}
.rbar{position:relative;height:12px;border-radius:9px;background:linear-gradient(90deg,#3d0e17 0 33%,#0f3a26 33% 52%,#3d0e17 52%);margin:10px 0 4px}
.rbar i{position:absolute;top:-4px;width:4px;height:20px;background:#fff;border-radius:3px;transition:left .15s}
.press{display:block;width:210px;height:210px;margin:14px auto 6px;border-radius:50%;border:6px solid #ff5a6b;background:radial-gradient(circle at 50% 40%,#ff4d5f,#a3132a);color:#fff;font:900 22px Unbounded,sans-serif;letter-spacing:.04em;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;box-shadow:0 0 0 0 rgba(255,61,81,.5);transition:transform .05s}
.press.dn{transform:scale(.94);box-shadow:0 0 0 14px rgba(255,61,81,.12)}
.press.vent{border-color:#5bc8ff;background:radial-gradient(circle at 50% 40%,#3cb8ff,#1462a8)}
.press small{display:block;font:700 13px Manrope;margin-top:6px;opacity:.85}
.anal{background:var(--p1);border:1px solid #2c4058;border-radius:16px;padding:12px;margin-top:12px}
.tg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.tgl{border:1px solid var(--ln);background:var(--p2);border-radius:10px;padding:9px;font-size:12.5px;font-weight:700;cursor:pointer;text-align:left}
.tgl.on{background:#0f3a26;border-color:var(--gn);color:#c9ffe3}
/* debrief */
.big{font-family:Unbounded,sans-serif;font-size:22px;font-weight:700;margin:6px 0 2px}
.stars{font-size:30px;letter-spacing:4px;color:var(--rr)}
.sc{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:800}
.ln{display:flex;gap:8px;padding:7px 0;border-bottom:1px dashed #1a2636;font-size:13.5px}
.ln span{flex:1}
.ln b{font-family:'JetBrains Mono',monospace}
.ok{color:var(--gn)}.no{color:#ff7a86}.mid{color:var(--am)}
.chk{display:flex;gap:8px;padding:6px 0;font-size:13.5px;line-height:1.35}
.err{background:#1e0a10;border:1px solid #4a1520;border-radius:12px;padding:10px 12px;margin-top:6px;font-size:13px;line-height:1.45}
.err b{color:#ff8b96}
.pearl{background:linear-gradient(135deg,#0d1f33,#0a1622);border:1px solid #23415e;border-radius:14px;padding:12px;margin-top:12px;font-size:13.5px;line-height:1.5}
.grid{font-size:22px;letter-spacing:2px;text-align:center;margin:10px 0}
.atl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.atc{background:var(--p1);border:1px solid var(--ln);border-radius:14px;padding:12px;cursor:pointer;min-height:96px}
.atc .e{font-size:26px}
.atc b{display:block;font-size:13px;margin-top:4px;line-height:1.25}
.atc small{color:var(--mu);font-size:11px}
.atc.lk{opacity:.45}
.kv{font-size:13.5px;line-height:1.5;margin-top:8px}
.kv b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:2px}
.ach{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--ln);font-size:13.5px}
.ach .e{font-size:24px;width:34px;text-align:center}
.ach.off{opacity:.35}
.lb{display:flex;gap:8px;padding:6px 0;font-size:13.5px;border-bottom:1px dashed var(--ln)}
.lb b{font-family:'JetBrains Mono',monospace}
.flash{position:fixed;inset:0;pointer-events:none;z-index:90;animation:fl .35s}
@keyframes fl{from{background:rgba(255,255,255,.75)}to{background:transparent}}
.howto li{margin:8px 0;line-height:1.45;font-size:14px}
.trend{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:15px;min-width:22px}
.vig{position:fixed;inset:0;pointer-events:none;z-index:89;animation:vg .8s forwards}
@keyframes vg{from{opacity:1}to{opacity:0}}
details.tl summary{cursor:pointer;color:var(--mu);font-size:12.5px;font-weight:700;margin-top:14px}
.epi{background:linear-gradient(135deg,#0f1c15,#0a120e);border:1px solid #1f4a33;border-radius:14px;padding:12px;margin-top:12px;font-size:13.5px;line-height:1.55}
.epi.dead{background:#120c0e;border-color:#3a1f26}
.badge2{display:inline-block;font-size:11px;font-weight:800;color:#ff8b96;background:#3d0e17;border-radius:7px;padding:3px 8px;margin-top:8px}
.auto{text-align:center;padding:22px 12px}
.auto .pb{height:6px;background:var(--p3);border-radius:6px;overflow:hidden;margin-top:14px}
.auto .pb i{display:block;height:100%;background:var(--gn);animation:prog 3.8s linear forwards;transform-origin:left}
.av{transition:box-shadow .4s}
.gl{font-size:13px;line-height:1.6;margin-top:8px}
.gl b{color:var(--spo)}
.cine{position:fixed;inset:0;padding:var(--sat) var(--sar) var(--sab) var(--sal);z-index:95;background:#020407;display:flex;align-items:center;justify-content:center;overflow:hidden;animation:cinIn .25s}
.cine.out{animation:cinOut .3s forwards}
@keyframes cinIn{from{opacity:0}}@keyframes cinOut{to{opacity:0}}
.cin-in{text-align:center;padding:20px;max-width:440px;animation:push 2.8s ease-out forwards}
@keyframes push{from{transform:scale(.92)}to{transform:scale(1.04)}}
.cin-top{font:700 13px 'JetBrains Mono',monospace;color:#7d8fa6}
.cin-stage{font-size:78px;margin:18px 0;display:flex;justify-content:center;gap:10px;align-items:flex-end}
.cin-av{font-size:62px;animation:fadeUp .6s .5s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}}
.cin-txt{font-size:17px;line-height:1.5;color:#e8eef6;min-height:52px}
.cin-skip{font-size:11px;color:#4b5b6e;margin-top:20px}
.cin-door{position:absolute;top:0;bottom:0;width:50.5%;background:linear-gradient(90deg,#3a2414,#5a3a22 40%,#3a2414);animation:doorL .8s .35s forwards}
.cin-door.l{left:0}.cin-door.r{right:0;animation-name:doorR}
.cin-door.l:after{content:"";position:absolute;right:16px;top:50%;width:10px;height:36px;border-radius:5px;background:#c9a24a}
@keyframes doorL{to{transform:translateX(-100%)}}@keyframes doorR{to{transform:translateX(100%)}}
.cin-red{position:absolute;inset:0;box-shadow:inset 0 0 140px 40px rgba(255,30,50,.55);animation:blink .5s infinite;pointer-events:none}
</style>
</head>

<script>
'use strict';
/* ================= Telegram ================= */
const TG = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
const inTG = !!(TG && TG.initData);
const BOT_LINK = window.SMENA_BOT_LINK || ''; // например: https://t.me/smena03_bot
function tgInit(){
  if(!TG) return;
  try{TG.ready();TG.expand();}catch(e){}
  try{TG.setHeaderColor('#05080d');TG.setBackgroundColor('#05080d');}catch(e){}
  try{if(TG.disableVerticalSwipes) TG.disableVerticalSwipes();}catch(e){}
  try{TG.setBottomBarColor&&TG.setBottomBarColor('#05080d');}catch(e){}
  // Полноэкранный режим (Bot API 8.0+): только на телефонах — на ПК это развернуло бы окно на весь монитор
  const mobile=/^(ios|android)/.test(TG.platform||'');

let cloudLast='',cloudBusy=false,cloudNext=null;
function cloudWrite(str,cb){
  if(!cloudOK()||str===cloudLast){cb&&cb();return;}
  if(cloudBusy){cloudNext=str;cb&&cb();return;} // запись уже идёт — допишем свежую версию следом
  cloudBusy=true;const done=cb;cb=()=>{cloudBusy=false;done&&done();if(cloudNext){const n=cloudNext;cloudNext=null;cloudWrite(n);}};
  const parts=[];for(let i=0;i<str.length;i+=CHUNK)parts.push(str.slice(i,i+CHUNK));
  if(parts.length>CMAX){cb&&cb();return;}
  let left=parts.length,fail=false;
  const after=()=>{ // счётчик частей пишем последним — читатель не увидит «полусохранение»
    if(fail){cb&&cb();return;}
    try{TG.CloudStorage.setItem(CK+'_n',String(parts.length),e=>{if(!e)cloudLast=str;cb&&cb();});}catch(_){cb&&cb();}};
  parts.forEach((pt,i)=>{try{TG.CloudStorage.setItem(CK+'_'+i,pt,e=>{if(e)fail=true;if(--left===0)after();});}catch(_){fail=true;if(--left===0)after();}});
}

const gauss=(x,mu,w,a)=>{const d=(x-mu)/w;return a*Math.exp(-.5*d*d)};

class ECGGen{

const MONS=[];
class Monitor{
  constructor(cv,o){this.c=cv;this.ctx=cv.getContext('2d');this.gen=new ECGGen((Math.random()*1e9)|0,'II');this.o=o;this.speed=o.speed||105;this.color=o.color||'#3dff8f';
    this.last=null;this.run=true;this.resize();this.loop=this.loop.bind(this);requestAnimationFrame(this.loop);MONS.push(this);}
  resize(){const d=window.devicePixelRatio||1,r=this.c.getBoundingClientRect();this.w=Math.max(20,r.width);this.h=Math.max(20,r.height);this.c.width=this.w*d;this.c.height=this.h*d;this.ctx.setTransform(d,0,0,d,0,0);this.x=0;this.py=null;}
  loop(ts){
    if(!this.run)return;
    if(!document.body.contains(this.c)){this.run=false;const i=MONS.indexOf(this);if(i>=0)MONS.splice(i,1);return;}
    if(this.last==null)this.last=ts;const dt=Math.min(.08,(ts-this.last)/1000);this.last=ts;
    if(this.o.paused&&this.o.paused()){requestAnimationFrame(this.loop);return;}
    const st=this.o.get();const ctx=this.ctx;const px=dt*this.speed;const n=Math.max(1,Math.ceil(px*4));const sub=dt/n;
    ctx.lineWidth=2;ctx.strokeStyle=this.color;ctx.lineJoin='round';
    for(let i=0;i<n;i++){
      const r=this.gen.step(sub,st.rhythm,st.hr);
      if(r.beat&&this.o.beat)this.o.beat();
      const y=clamp(this.h*.6-r.v*this.h*.36*(this.o.gain||1),2,this.h-2);
      const nx=this.x+px/n;
      ctx.clearRect(this.x+1,0,14,this.h);
      if(this.py!=null){ctx.beginPath();ctx.moveTo(this.x,this.py);ctx.lineTo(nx,y);ctx.stroke();}
      this.x=nx;this.py=y;
      if(this.x>=this.w){this.x=0;this.py=null;}
    }
    requestAnimationFrame(this.loop);
  }
  compress(){this.gen.compress();}
}

function drawPaper(cv,rh,hr,seed){
  const leads=['II','aVF','V2','V4'];const d=window.devicePixelRatio||1;const W=cv.getBoundingClientRect().width||340;
  const secs=6,mm=W/(secs*25),rowH=22*mm,H=rowH*leads.length+8*mm;
  cv.width=W*d;cv.height=H*d;cv.style.height=H+'px';const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);
  c.fillStyle='#fbf3ea';c.fillRect(0,0,W,H);

  for(let y=0,i=0;y<=H;y+=mm,i++){c.strokeStyle=i%5?'#f4cfc7':'#e79a8f';c.lineWidth=i%5?.5:1;c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();}
  leads.forEach((L,li)=>{

    c.moveTo(0,base);c.lineTo(mm*1,base);c.lineTo(mm*1,base-10*mm);c.lineTo(mm*6,base-10*mm);c.lineTo(mm*6,base);c.lineTo(mm*8,base);

}

function pickVariant(def,p,r){

  return null;
}

function newCall(def,rng,arrivedAt){
  const seed=rng.int(1,2e9);const r2=new RNG(hashStr('c'+seed));const p=sexHelp(def.gen(r2));
  const addr=makeAddr(r2),travel=r2.int(7,17),lift=r2.chance(.18);
  const vk=pickVariant(def,p,r2);if(vk){const v=VV[def.id][vk];if(v.mod){v.mod(p,r2);sexHelp(p);}}
  enrichPatient(def,p,r2);p.cf=r2.f();p.refuse=r2.chance(.35);
  return{def:vk?makeVariantDef(def,vk):def,p,seed,arrivedAt,addr,travel,lift};
}
function pickCase(){
  if(G.mode==='daily'){return CASE[G.order[G.made]];}
  const ri=rankIdx(save.xp);let pool=CASES.filter(c=>c.rank<=ri&&!G.recent.includes(c.id));if(!pool.length)pool=CASES.filter(c=>c.rank<=ri);
  const c=G.rng.pick(pool);G.recent.push(c.id);if(G.recent.length>3)G.recent.shift();return c;
}
function startShift(mode,caseId,practice){
  R=null;C=null;MG=null;try{stopMetro();stopTick();}catch(e){}if(typeof monRhythmOverride!=='undefined')monRhythmOverride=null;
  const seed=mode==='daily'?hashStr('smena03-'+todayStr()):(Date.now()>>>0);
  const rng=new RNG(seed);
  G={mode,practice:!!practice,seed,rng,clock:8*60,end:mode==='duty'?20*60:1e9,queue:[],made:0,maxCalls:mode==='daily'?5:mode==='train'?1:999,results:[],score:0,perfect:0,deaths:0,brigade:rng.pick([72,73,74,75,76]),recent:[],nextArrival:8*60,badTotal:0};
  if(mode==='daily'){G.order=rng.shuffle(CASES.map(c=>c.id)).slice(0,5);}
  closingConfirm(true);
  if(mode==='train'){const call=newCall(CASE[caseId],rng,G.clock);call.travel=0;call.lift=false;G.made=1;goTravel(call);return;}
  showDispatch();
}
function pump(){
  while(G.made<G.maxCalls&&G.nextArrival<=G.clock&&G.nextArrival<G.end){
    G.queue.push(newCall(pickCase(),G.rng,G.nextArrival));G.made++;
    G.nextArrival+=G.rng.int(16,48);
  }
}
function arrive(call){
  const d=call.def,p=call.p;const wait=G.clock-call.arrivedAt;
  const wr=d.wait!=null?d.wait:K(d).w;
  const base=Object.assign({},d.vitals(p));
  C={call,def:d,p,rng:new RNG(call.seed+7),s0:d.s0,s:Math.min(d.s0,d.s0-wait*wr),decay:d.decay,base,
    crash:Object.assign({sbp:55,dbp:30,hr:base.hr>=90?155:38,rr:base.rr>=22?40:6,spo2:70,gcs:3},d.crash||{}),
    rhythm:Object.assign({},d.rhythm(p)),known:{},asked:new Set(),answers:{},examsDone:new Set(),examT:{},exRes:{},tx:{},txT:{},txOrder:[],
    bad:[],useless:[],notes:[],log:[],flags:{},t0:G.clock,iv:false,monitor:false,dx:null,disp:null,arrests:0,rosc:false,cpr:null,wait};
  C.dxTrue=d.dxv?d.dxv(p):d.dx;C.hints=0;C.band=bandOf(C.s);
  {const pool=[...new Set([d.dx].concat(C.rng.shuffle(d.dxo)))].filter(x=>x!==C.dxTrue);C.dxOpts=C.rng.shuffle([C.dxTrue].concat(pool.slice(0,5)));}
  C.firstOf=list=>{const o=C.txOrder.find(x=>list.includes(x.id));return o?o.id:null;};
  tab='q';txFilter='';
  if(call.lift)addLog('Лифт не работает — поднимались пешком','warn');
  if(wait>25&&d.kat<4)addLog(`Пациент ждал бригаду ${Math.round(wait)} мин`,'warn');
  if(save.stats.calls<2&&!d.arrestStart)addLog('💬 Саня: «Начни с монитора и расспроса. Каждое действие ест время — пациент ждать не будет. Застрянешь — жми 💡»');
  mom('arrive','Вызов: '+callText(d,p));
  if(d.arrestStart||C.s<=0){C.s=0;arrivalCine(()=>startArrest(true,false));return;}
  showCall();
  arrivalCine(()=>{const cf=pickConflict(call,wait);if(cf&&C&&!C.ended&&!R)openConflict(cf);});
}
function vit(){
  const k=clamp(C.s/C.s0,0,1),h=C.s>C.s0?(C.s-C.s0)/Math.max(1,100-C.s0)*.75:0,o={};
  for(const key of VK){const b=C.base[key];const cr=key in C.crash?C.crash[key]:b;let v=cr+(b-cr)*k;if(h>0&&HEALK.includes(key))v+=(NORM[key]-v)*h;o[key]=v;}
  o.spo2=clamp(o.spo2,40,100);o.gcs=clamp(Math.round(o.gcs),3,15);o.hr=Math.max(20,o.hr);o.rr=Math.max(0,o.rr);return o;
}
function addLog(m,cls){C.log.unshift({t:fmtClock(G.clock),m:fp(m),cls:cls||''});}
function advance(min){
  C.s-=C.decay*min;G.clock+=min;
  if(C.s<=0){C.s=0;startArrest(false,false);return false;}
  return true;
}
function startTick(){stopTick();let last=performance.now();tickId=setInterval(()=>{const now=performance.now();const dt=(now-last)/1000;last=now;if(paused||busy||!C||document.hidden)return;if(!advance(dt*GAME_PER_SEC))return;updVitals();},250);}
function stopTick(){if(tickId)clearInterval(tickId);tickId=null;}
function doAction(label,min,fn){
  if(busy)return;busy=true;const b=$('#busy');$('#busyT').textContent=label+' · '+fmtMin(min);b.classList.remove('on');void b.offsetWidth;b.classList.add('on');
  hap.tap();
  setTimeout(()=>{b.classList.remove('on');busy=false;if(!C||C.ended)return;if(!advance(min))return;fn();if(!R||R.done)updAll();},470);
}
function fmtMin(m){return m<1?Math.round(m*60)+' с':(Math.round(m*10)/10).toString().replace('.',',')+' мин';}

function resolveTx(id,n){
  const d=C.def,v=vit();
  if(id==='ntg'&&v.sbp<90)return{bad:'Нитроглицерин при САД < 90 мм рт. ст. противопоказан — коллапс.',s:-20,base:{sbp:-20,dbp:-10}};
  let e=d.tx&&d.tx[id];
  if(!e&&TRAPS[id])return TRAPS[id];
  if(typeof e==='function')e=e(C.p,C,v);
  if(e&&e.seq){e=e.seq[n-1]||{neutral:1,msg:'Повторно — без дополнительного эффекта'};}
  else if(e&&n>1&&!e.repeat&&!['nor','dop'].includes(id)){e={neutral:1,msg:'Уже сделано — без дополнительного эффекта'};}
  if(!e)e=genericTx(id,v,n);
  return e;
}
function genericTx(id,v,n){
  if(id==='o2')return v.spo2<94?{s:3,base:{spo2:3},good:1,msg:'SpO₂ немного растёт'}:{neutral:1,msg:'SpO₂ ≥ 94% — кислород не нужен'};
  if(id.startsWith('pos_'))return{neutral:1,msg:'Положение изменено'};
  if(id==='nacl')return{neutral:1,msg:'Инфузия идёт'};
  if(id==='ins')return{bad:'Инсулин без подтверждённой гипергликемии — риск тяжёлой гипогликемии.',s:-15,set:{glu:Math.max(1.5,C.base.glu-3)}};
  if(id==='eitc')return{bad:'Кардиоверсия без показаний (нет нестабильной тахиаритмии).',s:-20};
  if(id==='needle')return{bad:'Плевральная пункция без признаков напряжённого пневмоторакса — ятрогенный пневмоторакс.',s:-15};
  if(id==='diaz')return{bad:'Седация без показаний — угнетение дыхания и сознания.',s:-8};
  if(id==='morph')return{neutral:1,msg:'Боль уменьшилась'};
  if(id==='bvm')return v.rr<8||v.spo2<85?{s:8,fix:.7,base:{spo2:6},good:1,msg:'Вентиляция улучшает оксигенацию'}:{useless:true,msg:'Пациент дышит сам — вентиляция не нужна'};
  if(id==='nor'||id==='dop'){if(v.sbp>=110)return{bad:'Вазопрессор при нормальном или высоком АД — гипертензия, аритмии, ишемия.',s:-10,base:{sbp:25,hr:id==='dop'?20:5}};
    if(v.sbp<90)return{s:8,fix:.8,base:{sbp:id==='dop'?18:22,dbp:10,hr:id==='dop'?15:4},good:1,msg:id==='dop'?'АД поднимается, но растёт и ЧСС — норадреналин предпочтительнее (меньше аритмий)':'АД поднимается. Вазопрессор держит давление, но причину шока не лечит'};
    return{useless:true,msg:'АД приемлемое — вазопрессор не нужен'};}
  if(id==='atro'){if(v.hr<55&&v.sbp<95)return{s:4,base:{hr:18,sbp:8},good:1,msg:'ЧСС и АД выросли'};if(v.hr>90)return{bad:'Атропин при тахикардии — ещё выше ЧСС и потребность миокарда в кислороде.',s:-6,base:{hr:20}};return{useless:true,msg:'Значимой брадикардии нет — атропин не нужен'};}
  if(id==='tnk')return{bad:C.def.id==='stemi'?'РСЦ с ЧКВ доступен в пределах 120 минут — тромболизис не показан, а риск кровотечения реальный.':C.def.id==='stroke'?'Тромболизис при инсульте — только после КТ в стационаре: кровоизлияние не исключено.':'Тромболизис без показаний — риск фатального кровотечения.',s:-18};

  if(id==='metoc')return{neutral:1,msg:'Противорвотное введено'};

  if(id==='calm')return v.gcs>=13?{neutral:1,msg:'Пациент немного успокоился'}:{useless:true,msg:'Пациент без сознания — разговоры не помогут'};

function applyEff(id,e){
  const T=TX[id];
  if(e.chance!=null){const win=C.rng.chance(e.chance);applyEff(id,Object.assign({},win?e.win:e.lose));return;}
  if(e.s)C.s=clamp(C.s+e.s,0,100);
  if(e.fix!=null)C.decay*=e.fix;
  if(e.decay!=null)C.decay=e.decay;
  if(e.base)for(const k in e.base)C.base[k]+=e.base[k];
  if(e.set)Object.assign(C.base,e.set);
  if(e.rhythm)C.rhythm=Object.assign({},e.rhythm);
  if(e.flag)C.flags[e.flag]=true;
  if(e.bad){C.bad.push({n:T.n+' '+T.d,why:e.bad});addLog('⚠ '+T.n+' — состояние ухудшилось','bad');hap.err();vig('rgba(255,40,60,.5)');}
  else if(e.useless){C.useless.push(T.n);addLog(T.n+': '+e.msg,'warn');}
  else addLog(T.n+(e.msg?': '+e.msg:''),e.good?'good':'');
  if(e.good&&!e.bad&&(e.s||0)>=20)mom('save',T.n+(e.msg?': '+e.msg:''),e.rhythm?{rhythm:e.rhythm,hr:(e.set&&e.set.hr)||84}:null);
  if(e.good&&!e.bad){hap.ok();vig('rgba(40,230,140,.28)');}
}
function useTx(id){
  const T=TX[id];
  if(T.iv&&!C.iv){toast('Нет венозного доступа — сначала катетеризация вены');hap.warn();return;}
  if(T.mon&&!C.monitor){toast('Нужен монитор-дефибриллятор — подключите монитор');hap.warn();return;}
  if(id==='iv'&&C.iv){toast('Вена уже есть');return;}
  if(id==='iv'){openIV();return;}
  if(id==='eti'&&!C.etiAim&&vit().gcs<=8){openETI();return;}
  if(id==='igel'&&!C.igelAim&&vit().gcs<=8){openIgel();return;}
  if(id==='eti')C.etiAim=0;
  if(id==='igel')C.igelAim=0;
  if(id==='needle'&&C.def.id==='ptx'&&!C.tx.needle&&!C.needleAim){openNeedle();return;}
  if(id==='needle')C.needleAim=0;
  doAction(T.n,T.t,()=>{
    if(id==='iv'){C.iv=true;C.tx.iv=1;addLog('Катетер 18G в локтевой вене');return;}
    const n=(C.tx[id]||0)+1;C.tx[id]=n;if(C.txT[id]==null)C.txT[id]=G.clock-C.t0;C.txOrder.push({id,t:G.clock-C.t0});
    if(id==='atp')C.atpMon=C.monitor;
    applyEff(id,resolveTx(id,n));
    if(C.s<=0){startArrest(false,false);}
  });
}

function scoreCall(outcome){

  const best=[].concat(val(d.disp.best)),ok=[].concat(val(d.disp.ok)||[]);
  if(C.conflict){const m={ok:['ok','Конфликт разрешён грамотно',50],mid:['mid','Конфликт: можно было лучше',0],bad:['no','Конфликт: эскалация',-80],over:['mid','Конфликт: избыточная реакция',-20]}[C.conflict.r];raw+=m[2];L.push(m);}
  if(C.ref){if(C.refOK){raw+=100;L.push(['ok','Убедили поехать в стационар',100]);}
    if(C.ref.lie){raw-=60;L.push(['no','Обман пациента («только на часик»)',-60]);}
    if(C.ref.threat){raw-=40;L.push(['no','Запугивание пациента',-40]);}

    if(f.bad){raw-=100;L.push(['no','Отказ оформлен с нарушениями',-100]);}else{const pts=f.good*15;raw+=pts;L.push([f.good===4?'ok':'mid',`Информированный отказ: ${f.good}/4 пункта`,pts]);}
    if(bh){raw+=80;L.push(['mid','Пациент остался дома — здесь это допустимо',80]);}else C.s=Math.min(C.s,35);}
  const unstableHome=!died&&C.disp==='home'&&(C.s<65||C.decay>.25);

    else if(C.disp==='home'){raw-=150;L.push(['no','Оставлен дома — повторный вызов через 3 часа',-150]);}
    else L.push(['no','Не тот стационар',0]);}

  const cn=CL.filter(x=>x[0]).length;L.push([cn===CL.length?'ok':cn?'mid':'no',`Чек-лист: ${cn}/${CL.length}`,cn*per]);
  if(died){raw-=200;L.push(['no','Летальный исход',-200]);}

  if(C.rosc&&!died){const rb=d.arrestStart?150:60;raw+=rb;L.push(['ok','ROSC — вернули к жизни',rb]);}
  if(C.bad.length){raw-=120*C.bad.length;L.push(['no','Опасные назначения ×'+C.bad.length,-120*C.bad.length]);}
  if(C.useless.length){raw-=15*C.useless.length;L.push(['mid','Лишние манипуляции ×'+C.useless.length,-15*C.useless.length]);}

}

function analysisGo(shock){

function showDispatch(){
  C=null;R=null;stopTick();
  setBack(()=>confirmQuit());
  if(G.mode==='duty'&&(G.clock>=G.end||G.deaths>=3)){endShift();return;}
  pump();
  if(!G.queue.length){
    if(G.made>=G.maxCalls||G.nextArrival>=G.end){endShift();return;}
  }
  const lbl=G.mode==='daily'?`Вызов ${Math.min(G.results.length+1,5)}/5`:`До конца смены ${Math.max(0,Math.round((G.end-G.clock)/60*10)/10).toString().replace('.',',')} ч`;
  let h=`<div class="top"><span class="clk">${fmtClock(G.clock)}</span><span class="pill">${lbl}</span><span class="sp"></span><span class="pill mono">★ ${G.score.toLocaleString('ru')}</span><button class="ib" data-a="quit">✕</button></div>
  <div class="stat3"><div><b>${G.results.filter(r=>!r.died).length}</b><span>спасено</span></div><div><b>${G.deaths}</b><span>летальных</span></div><div><b>${G.perfect>1?'×'+(1+.1*Math.min(5,G.perfect)).toFixed(1):'—'}</b><span>серия ★★★</span></div></div>`;
  if(!G.queue.length){
    h+=`<div class="card" style="text-align:center;padding:26px 14px"><div style="font-size:40px">☕</div><b>Бригада на подстанции</b><div class="mut" style="font-size:13px;margin-top:4px">Следующий вызов около ${fmtClock(G.nextArrival)}</div></div>
    <button class="btn primary center" data-a="waitCall">Ждать вызова</button>`;
  }else{
    h+=`<div class="sec">📻 Вызовы · бригада №${G.brigade}</div>`;
    G.queue.forEach((c,i)=>{const pr=K(c.def);const w=Math.round(G.clock-c.arrivedAt);
      h+=`<div class="callc" style="--c:${pr.c}" data-a="take" data-v="${i}"><div class="row"><span class="pr">${pr.n}</span><span class="sp"></span><span class="mut mono" style="font-size:11.5px">${w>0?'ждёт '+w+' мин':'только что'}</span></div>
      <div class="mut" style="font-size:11.5px;margin-top:1px">${pr.sub}${c.def.kat<=2?' · норматив доезда 20 мин':''}</div><div class="why">${callText(c.def,c.p)}</div><div class="ad">📍 ${c.addr} · ~${c.travel} мин езды</div>${c.def.kat<=2&&w>=20?`<div class="badge2">☎ Повторный звонок: «${fp('{Ему|Ей}',c.p)} хуже!»</div>`:''}</div>`;});
    h+=`<div class="radio">📻 ${pickRadio()}</div>`;
    if(G.queue.length>1)h+=`<div class="radio">Пока вы на одном вызове, остальные пациенты ждут. 1–2 категория ухудшаются быстро, норматив доезда — 20 минут. 4 категория подождёт — сортируйте с умом.</div>`;
  }
  if(G.mode==='duty')h+=`<button class="btn center" data-a="endShiftAsk" style="margin-top:16px">🏁 Сдать смену досрочно</button>`;
  render(h);
}

function goTravel(call){
  setBack(null);
  const t=call.travel+(call.lift?3:0);
  if(t>0){G.clock+=t;
    render(`<div class="travel"><div class="mut mono" style="font-size:12px">${K(call.def).n} · ${K(call.def).sub}</div><div class="disp" style="font-size:19px;margin-top:6px">Выезд</div>
    <div class="road"><div class="lights"></div><div class="amb">🚑</div></div><div style="font-weight:700">📍 ${call.addr}</div><div class="mut" style="margin-top:6px">В пути ${t} мин · ${pickDriver()}</div></div>`);
    siren();setTimeout(()=>arrive(call),2300);
  }else arrive(call);
}

    const L=worse?(cons?['«Доктор, мне хуже…»','«Что-то совсем плохо…»','Пациент побледнел, на лбу холодный пот']:['Дыхание стало поверхностным','Кожа посерела','Пульс на периферии слабеет']):(cons?['«Кажется, отпускает…»','Пациент заметно порозовел','«Уже полегче, доктор»']:['Цвет кожи улучшается','Дыхание стало ровнее']);
    addLog((worse?'⚠ ':'✓ ')+L[Math.floor(Math.random()*L.length)],worse?'bad':'good');renderLog();if(worse)hap.warn();}
  if(C.monitor&&C.s<25&&C.def.arrest==='vf'&&!C.flags.pvc){C.flags.pvc=1;addLog('⚠ Монитор: частая желудочковая экстрасистолия — угроза ФЖ','bad');renderLog();}
  if(C.monitor&&C.s<22&&performance.now()-lastAlarm>3500){lastAlarm=performance.now();alarmTone();hap.warn();}

  if(false);

function sq(r){return r.died?'⬛':r.stars===3?'🟩':r.stars===2?'🟨':r.stars===1?'🟧':'🟥';}
function endShift(){
  stopTick();closingConfirm(false);setBack(null);
  const saved=G.results.filter(r=>!r.died).length,total=G.results.length;
  const grid=G.results.map(r=>r.emoji+sq(r)).join(' ');
  const r0=rankIdx(save.xp-(G.practice?0:G.score));const r1=rankIdx(save.xp);
  save.stats.shifts++;save.stats.best=Math.max(save.stats.best,G.score);
  if(total>=3&&G.badTotal===0)unlock('clean');
  if(G.mode==='duty'&&G.clock>=G.end&&G.deaths<3)unlock('night');
  let dailyRec=null;
  if(G.mode==='daily'&&!G.practice&&total>=G.maxCalls){
    const td=todayStr();dailyRec={score:G.score,grid,saved,total};save.daily[td]=dailyRec;
    save.streak.n=save.streak.last===yesterdayStr()?save.streak.n+1:(save.streak.last===td?save.streak.n:1);save.streak.last=td;
    if(save.streak.n>=7)unlock('week');
    apiPost('score',{mode:'daily',date:td,score:G.score,saved,total,grid});
  }else if(G.mode==='duty'){apiPost('score',{mode:'duty',date:todayStr(),score:G.score,saved,total,grid});}
  persist();
  lastShare={mode:G.mode,score:G.score,saved,total,grid};
  const why=G.mode==='duty'&&G.deaths>=3?'Три летальных исхода — смену отстранили, разбор на ЛКК.':G.mode==='duty'&&G.clock>=G.end?'20:00 — смена сдана.':'';
  let h=`<div style="text-align:center;padding-top:14px"><div style="font-size:44px">🏁</div><div class="big">Смена сдана</div><div class="mut">${G.mode==='daily'?'Ежедневная смена · '+new Date().toLocaleDateString('ru'):'Дежурство'}${G.practice?' · без зачёта':''}</div>
  ${why?`<div class="mut" style="font-size:13px;margin-top:6px">${why}</div>`:''}<div class="grid">${grid||'—'}</div><div class="sc">${G.score.toLocaleString('ru')}</div><div class="mut">очков · спасено ${saved}/${total}</div></div>`;
  if(r1>r0)h+=`<div class="card" style="text-align:center;border-color:var(--rr)"><div style="font-size:40px">${RANKS[r1][2]}</div><b>Новый ранг: ${RANKS[r1][1]}</b><div class="mut" style="font-size:12.5px">Открыты новые сценарии для дежурства</div></div>`;
  if(G.results.length){const best=G.results.slice().sort((a,b)=>b.score-a.score)[0];
    h+=`<div class="sec">Вызовы смены</div><div class="card" style="margin-top:0">${G.results.map((r,i)=>`<div class="ln"><span>${i+1}. ${r.emoji} ${r.dx}${r.rosc?' ⚡':''}</span><b class="${r.died?'no':r.stars>=3?'ok':r.stars>=2?'mid':'no'}">${r.died?'⬛':'★'.repeat(r.stars)||'☆'} ${r.score}</b></div>`).join('')}</div>`;
    h+=`<div class="stat3"><div><b>${fmtClock(G.clock)}</b><span>конец смены</span></div><div><b>${G.results.filter(r=>r.rosc).length}</b><span>ROSC</span></div><div><b>${G.badTotal}</b><span>опасных ошибок</span></div></div>`;
    if(best&&!best.died)h+=`<div class="pearl">🏅 <b>Вызов смены:</b> ${best.emoji} ${best.dx} — ${best.score} очков</div>`;}
  h+=`<button class="btn blue center" data-a="share">📤 Поделиться результатом</button>`;
  if(inTG&&TG.sendData&&!API&&!(TG.initDataUnsafe&&TG.initDataUnsafe.query_id))h+=`<button class="btn center" data-a="sendBot">🤖 Отправить результат боту</button>`;

  render(h);hap.ok();

}

   <text x="12" y="22" font-size="13" fill="#ffd6d6" id="ets">SpO₂ ${MG.spo2}%</text>

  <button class="btn primary center" data-a="etiGo" style="font-size:18px">🫁 Ввести трубку</button>
  <div class="row" style="margin-top:4px">${MG.fails>=1?'<button class="btn center blue" style="margin:0" data-a="etiIgel">Перейти на i-gel</button>':''}<button class="btn center" style="margin:0" data-a="etiAbort">Прервать — вентиляция мешком</button></div>`,true);
  const loop=ts=>{if(!MG||MG.type!=='eti'||MG.done||!$('#eti'))return;const t=(ts-MG.t0)/1000,dt=(ts-MG.last)/1000;MG.last=ts;

function mom(type,text,ecg){if(!C)return;C.moments=C.moments||[];if(C.moments.length>14)return;C.moments.push({t:fmtClock(G.clock),type,text:fp(text,C.p),ecg:ecg?{rhythm:Object.assign({},ecg.rhythm),hr:ecg.hr}:null});}
const MOM_E={arrive:'🚪',crit:'🚨',arrest:'💔',shock:'⚡',rosc:'💚',save:'💉',iv:'🎯',needle:'🫧',eti:'🫁',conf:'🤝',ref:'🗣️',end:'🏁'};
function drawStrip(cv,rh,hr){
  const d=window.devicePixelRatio||1,W=cv.getBoundingClientRect().width||320,H=90;cv.width=W*d;cv.height=H*d;cv.style.height=H+'px';
  const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);c.fillStyle='#000';c.fillRect(0,0,W,H);
  c.strokeStyle='#0d2a1a';for(let x=0;x<W;x+=20){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke();}
  const g=new ECGGen(77,'II');c.strokeStyle='#3dff8f';c.lineWidth=2;c.beginPath();const secs=3.2,fs=400;
  for(let i=0;i<secs*fs;i++){const r=g.step(1/fs,rh,hr);const x=i/(secs*fs)*W,y=clamp(H*.6-r.v*H*.34,2,H-2);i?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();
}
function replaySlides(res){
  const m=(C.moments||[]).slice();const pri={rosc:9,shock:8,arrest:8,save:7,needle:7,eti:7,crit:6,iv:5,conf:5,ref:5,arrive:4,end:4};
  let pick=m.filter(x=>x.type!=='shock');const sh=m.filter(x=>x.type==='shock');if(sh.length)pick.push(Object.assign({},sh[sh.length-1],{text:sh.length>1?`${sh.length} разряда — и ритм сдался`:sh[0].text}));
  pick.sort((a,b)=>a.t<b.t?-1:a.t>b.t?1:0);if(pick.length>7)pick=pick.filter(x=>pri[x.type]>=5).slice(0,7);
  pick.push({t:'',type:'final',text:''});return pick;
}

  const text=`🎬 СМЕНА 03 — повтор вызова\n${C.p.S}, ${C.p.ageS} · ${C.dxTrue}\n\n${lines.join('\n')}\n\n${'★'.repeat(r.stars)}${'☆'.repeat(3-r.stars)} · ${r.total} очков`;
  if(inTG){try{TG.openTelegramLink(BOT_LINK?'https://t.me/share/url?url='+encodeURIComponent(BOT_LINK)+'&text='+encodeURIComponent(text):'https://t.me/share/url?url='+encodeURIComponent(text));return;}catch(e){}}
  try{navigator.clipboard.writeText(text).then(()=>toast('Повтор скопирован — вставьте в любой чат'),()=>showCopy(text));}catch(e){showCopy(text);}
};

/* запрет зума и выделения */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});
document.addEventListener('contextmenu',e=>{if(!(e.target.closest&&e.target.closest('input,textarea')))e.preventDefault();});
document.addEventListener('selectstart',e=>{if(!(e.target.closest&&e.target.closest('input,textarea')))e.preventDefault();});
/* boot */
tgInit();
loadSave(()=>{applyCity();showMenu();});
</script>
</body>
